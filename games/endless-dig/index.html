<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>The Endless Dig</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="The Endless Dig game view"></canvas>
      <div id="hud" aria-live="polite">
        <header class="hud-top">
          <h1>The Endless Dig</h1>
          <p class="tagline">Something is down there.</p>
        </header>
        <aside class="hud-panel">
          <div class="stat">
            <span class="label">Depth</span>
            <span class="value" data-stat="depth">0 m</span>
          </div>
          <div class="stat">
            <span class="label">Dirt</span>
            <span class="value" data-stat="dirt">0</span>
          </div>
          <label class="dig-power">
            <span class="label">Dig power</span>
            <span class="dig-power-row">
              <input
                id="dig-power"
                type="range"
                min="1"
                max="256"
                step="1"
                value="1"
                aria-valuetext="1/32 block"
              />
              <span class="value" data-stat="dig-power">1/32</span>
            </span>
          </label>
          <button type="button" id="reset-progress" class="hud-reset">
            Reset
          </button>
        </aside>
        <div id="save-indicator" class="save-indicator" aria-hidden="true">
          Saved
        </div>
        <p class="hud-hint">
          Tap to dig · drag to scroll (debug) · Reset clears save
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
