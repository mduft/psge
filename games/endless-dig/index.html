<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>The Endless Dig</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="The Endless Dig game view"></canvas>
      <div id="hud" aria-live="polite">
        <header class="hud-top">
          <h1>The Endless Dig</h1>
          <p class="tagline">Something is down there.</p>
        </header>
        <aside class="hud-panel">
          <div class="stat">
            <span class="label">Depth</span>
            <span class="value" data-stat="depth">0 m</span>
          </div>
          <div class="stat">
            <span class="label">Dirt</span>
            <span class="value" data-stat="dirt">0</span>
          </div>
          <div class="stat">
            <span class="label">Dig power</span>
            <span class="value" data-stat="dig-power">1/32</span>
          </div>
          <div class="stat">
            <span class="label">Auto</span>
            <span class="value" data-stat="passive">0/s</span>
          </div>
          <section class="shop" aria-label="Shop">
            <h2 class="shop-title">Shop</h2>
            <div id="shop-list" class="shop-list"></div>
          </section>
          <section class="debug-panel" id="debug-panel" hidden>
            <h2 class="shop-title">Debug</h2>
            <div class="debug-dirt">
              <span class="label">Give dirt</span>
              <span class="debug-dirt-row">
                <button type="button" class="hud-reset" data-give-dirt="100">
                  +100
                </button>
                <button type="button" class="hud-reset" data-give-dirt="1000">
                  +1K
                </button>
                <button type="button" class="hud-reset" data-give-dirt="1000000">
                  +1M
                </button>
              </span>
            </div>
            <label class="debug-toggle">
              <input type="checkbox" id="debug-scroll" />
              <span>Drag to scroll</span>
            </label>
            <button type="button" id="reset-progress" class="hud-reset">
              Reset
            </button>
          </section>
        </aside>
        <div id="save-indicator" class="save-indicator" aria-hidden="true">
          Saved
        </div>
        <p class="hud-hint">
          Tap to dig · spend dirt in the shop · ?debug=1 for tools
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
