<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>The Endless Dig</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="The Endless Dig game view"></canvas>
      <div id="hud" aria-live="polite">
        <header class="hud-top">
          <h1>The Endless Dig</h1>
          <p class="tagline">Something is down there.</p>
        </header>
        <aside class="hud-stats">
          <div class="stat">
            <span class="label">Shaft</span>
            <span class="value" data-stat="depth">—</span>
          </div>
          <div class="stat">
            <span class="label">View</span>
            <span class="value" data-stat="view">0 m</span>
          </div>
          <div class="stat">
            <span class="label">Chunk</span>
            <span class="value" data-stat="chunk">0</span>
          </div>
          <div class="stat">
            <span class="label">Logical Y</span>
            <span class="value" data-stat="logical">0</span>
          </div>
          <div class="stat">
            <span class="label">Origin Y</span>
            <span class="value" data-stat="origin">0</span>
          </div>
          <div class="stat">
            <span class="label">Engine Y</span>
            <span class="value" data-stat="engine">0</span>
          </div>
          <div class="stat">
            <span class="label">Loaded</span>
            <span class="value" data-stat="chunks">0</span>
          </div>
        </aside>
        <p class="hud-hint">Drag & hold to scroll · ?depth=10000 to stress-test</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
